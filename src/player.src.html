<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Quiz — Player</title>
<script>
/* Student links and QR codes used to open this folder itself (…/live-quiz/?s=CODE#k=…).
   The folder now opens the player, so send phones on to the phone page, keeping the code and the key. */
(function(){ try { var q = new URLSearchParams(location.search);
  if (q.has('s') && !q.has('audience') && !q.has('open')) { window.LQ_FORWARD = true; location.replace('join/' + location.search + location.hash); }
} catch(e){} })();
</script>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#15171c; --muted:#5b616d; --line:#d9d6ce;
  --accent:#2350b8; --accent-ink:#ffffff; --accent-soft:#dbe4f8;
  --sure:#2350b8; --guess:#9db1e6; --ghost:#c9c6bd;
  --good:#16804a; --good-soft:#d7efe0; --bad:#b93a27; --bad-soft:#f6ddd8; --warn:#a86a10;
  font-size:clamp(16px,1.3vw,28px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.screen{height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.top{display:flex;align-items:center;gap:.8rem;padding:.7rem 1.4rem;border-bottom:1px solid var(--line);background:var(--panel)}
.top .title{font-weight:700;font-size:1.15rem}
.spacer{flex:1}
.qnum{font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.qnum span{font-weight:500;color:var(--muted);margin-left:.3rem;font-size:1rem}
.badge{padding:.25rem .7rem;border-radius:999px;font-weight:700;font-size:.85rem}
.badge.r2{background:#fbe9c6;color:#7a4a00}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:.95rem}
button.chip:hover{border-color:var(--accent)}
.net{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--muted)}
.net i{width:.7rem;height:.7rem;border-radius:50%;background:var(--warn);display:inline-block}
.net.ok i{background:var(--good)} .net.err i{background:var(--bad)}
.warn{color:var(--bad);font-weight:600}
.hint{color:var(--muted);font-size:.85rem}

/* question screen */
.grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:1.2rem;padding:1rem 1.4rem;min-height:0}
.left,.right{min-height:0;overflow:auto}
.left{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.4rem}
.stem p{margin:0 0 .7rem}
.stem ul{margin:.2rem 0 .8rem 1.2rem;padding:0}
.stem li{margin:.15rem 0}
.lead{font-weight:700;margin:.9rem 0 0;font-size:1.05rem}
figure.qimg{margin:.6rem 0 .8rem;text-align:center}
figure.qimg img{max-width:100%;max-height:40vh;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
figure.qimg figcaption{color:var(--muted);font-size:.8rem;margin-top:.3rem}
.right{display:flex;flex-direction:column;gap:.6rem}
.status{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.55rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem}
.status .count{font-size:1.25rem}
.status .count b{font-size:1.7rem}
.status .timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.7rem}
.status .timer.low{color:var(--bad)}
.tbar{flex-basis:100%;height:.4rem;background:#ebe9e3;border-radius:99px;overflow:hidden}
.tbar span{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.status .note{flex-basis:100%;color:var(--muted);font-size:.85rem}
.legend{display:inline-flex;gap:.9rem;font-size:.85rem;color:var(--muted);margin-left:auto}
.legend span::before{content:"";display:inline-block;width:.9rem;height:.6rem;margin-right:.3rem;vertical-align:middle;border-radius:2px;background:var(--sure)}
.legend span.g::before{background:repeating-linear-gradient(45deg,var(--guess) 0 4px,#c3d0f1 4px 7px)}
.opts{display:flex;flex-direction:column;gap:.45rem}
.opt{display:grid;grid-template-columns:2.1rem 1fr auto;gap:.7rem;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:.45rem .8rem}
.opt .letter{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#eceae4}
.opt .otext{min-width:0}
.opt .bar{position:relative;height:.75rem;margin-top:.3rem;background:#efede8;border-radius:99px;overflow:hidden;display:flex}
.opt .bar span{height:100%}
.opt .bar .s{background:var(--sure)}
.opt .bar .g{background:repeating-linear-gradient(45deg,var(--guess) 0 4px,#c3d0f1 4px 7px)}
.opt .ghost{height:.3rem;margin-top:.25rem;background:#f1efea;border-radius:99px;overflow:hidden}
.opt .ghost span{display:block;height:100%;background:var(--ghost)}
.opt .ocount{text-align:right;font-variant-numeric:tabular-nums;min-width:3.6rem}
.opt .ocount b{font-size:1.25rem;display:block;line-height:1.05}
.opt .ocount small{color:var(--muted);font-size:.75rem}
.opt .r1{font-size:.75rem;color:var(--muted)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .letter{background:var(--good);color:#fff}
.opt.correct .bar .s{background:var(--good)}
.opt.correct .bar .g{background:repeating-linear-gradient(45deg,#7cc39b 0 4px,#b5dfc6 4px 7px)}
.opt.dim{opacity:.62}
.explain .ans{display:flex;gap:.7rem;align-items:baseline;padding:.6rem .9rem;border-radius:10px;background:var(--good-soft);border:1px solid #a9d8bb;margin-bottom:.8rem}
.explain .ans b{font-size:1.5rem;color:var(--good)}
.explain h3{margin:1rem 0 .4rem;font-size:1rem}
.explain ul.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35rem}
.explain ul.why li{padding:.35rem .6rem;border-radius:8px}
.explain ul.why li.top{background:var(--bad-soft)}
.explain ul.why b{display:inline-block;width:1.4rem}
.tag{font-style:normal;font-size:.78rem;font-weight:700;color:var(--bad);margin-left:.3rem;white-space:nowrap}
.obj{margin-top:1rem;padding-top:.7rem;border-top:1px dashed var(--line)}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;margin-top:.8rem;font-size:.9rem}
.controls{display:flex;align-items:center;gap:.7rem;padding:.7rem 1.4rem;border-top:1px solid var(--line);background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:.6rem 1.1rem;font-weight:600}
a.btn{display:inline-block;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{padding:.3rem .7rem;font-size:.85rem}
.btn kbd{font:inherit;font-size:.72rem;opacity:.75;margin-left:.45rem;border:1px solid currentColor;border-radius:4px;padding:0 .3rem}

/* library + lobby */
.libgrid,.lobbygrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.4rem;padding:1.2rem 1.4rem;min-height:0;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.4rem}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6rem;border:2px dashed var(--line)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h1{margin:0}
.filebtn{display:inline-block;cursor:pointer}
.loaderr{max-width:34rem;text-align:left}
.loaderr ul{margin:.3rem 0 0 1rem;padding:0}
.recent{display:flex;flex-direction:column;gap:.5rem}
.rrow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:.5rem;align-items:center;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px}
.rrow .rt{font-weight:600}
.rrow .rm{color:var(--muted);font-size:.8rem}
.rrow .rd{font-size:.85rem;margin:.1rem 0 .15rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.casesover{position:fixed;inset:0;z-index:40;background:rgba(20,24,30,.55);display:flex;align-items:center;justify-content:center;padding:4vh 1rem}
.cpanel{background:var(--panel);border-radius:14px;max-width:54rem;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.chead{display:flex;gap:1rem;align-items:flex-start;padding:1.1rem 1.3rem .6rem;border-bottom:1px solid var(--line)}
.chead>div{flex:1;min-width:0}
.chead h2{margin:0 0 .2rem}
.chead .cdesc{margin:.2rem 0 .3rem}
.cpanel>.hint{margin:.6rem 1.3rem 0}
.clist{list-style:none;margin:0;padding:.4rem 1.3rem;overflow:auto;flex:1}
.clist li{display:flex;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.clist li:last-child{border-bottom:0}
.clist .cn{flex:none;width:2rem;text-align:right;font-weight:700;color:var(--muted)}
.clist .ctopic{font-size:.8rem;color:var(--muted)}
.clist .cconcept{font-weight:600}
.clist .cstem{color:var(--muted);font-style:italic;font-size:.9rem}
.cfoot{display:flex;gap:.5rem;justify-content:flex-end;padding:.8rem 1.3rem;border-top:1px solid var(--line)}
.join{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6rem}
.join .qr{width:min(48vh,28rem);aspect-ratio:1;background:#fff;border-radius:12px;padding:.2rem}
.join .qr svg{width:100%;height:100%;display:block}
.join .code{font-size:2.6rem;font-weight:800;letter-spacing:.18em}
.join .url{font-size:.95rem;color:var(--muted);word-break:break-all;max-width:36rem}
.join .joined{font-size:1.5rem}
.join .check,.qrover .check{color:var(--muted);font-size:1rem}
.join .check b,.qrover .check b{color:var(--ink);font-size:1.25rem;letter-spacing:.12em;margin-left:.3rem}
.join .warn{max-width:30rem}
.settings h2{margin:0 0 .8rem;font-size:1.2rem}
.settings .pack{display:flex;gap:.6rem;align-items:center;padding:.6rem .8rem;background:var(--accent-soft);border-radius:10px;margin-bottom:.4rem}
.settings .pack b{flex:1}
.settings label{display:block;margin:.75rem 0 .2rem;font-weight:600;font-size:.95rem}
.settings input[type=url],.settings input[type=number],.settings select{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:400}
.settings input[type=number]{width:6rem}
.settings .check{display:flex;gap:.5rem;align-items:flex-start;font-weight:400}
.settings .check input{margin-top:.3rem}
.settings small{color:var(--muted);display:block;font-size:.8rem}
.settings .row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.btn.big{font-size:1.2rem;padding:.8rem 1.6rem;margin-top:1.2rem;width:100%}

/* overlays */
.qrover,.zoomover{position:fixed;inset:0;background:rgba(244,243,239,.97);display:none;align-items:center;justify-content:center;z-index:10}
.qrover.open,.zoomover.open{display:flex}
.qrover .box{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center}
.qrover .qr{width:min(70vh,40rem);aspect-ratio:1}
.qrover .qr svg{width:100%;height:100%}
.qrover .code{font-size:3rem;font-weight:800;letter-spacing:.18em}
.zoomover{cursor:zoom-out;padding:2vh 2vw}
.zoomover img{max-width:96vw;max-height:94vh;background:#fff;border-radius:8px;box-shadow:0 6px 30px rgba(0,0,0,.2)}

/* end */
.endgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:1.4rem;padding:1.2rem 1.4rem;min-height:0}
.endgrid .card{overflow:auto}
.avg{font-size:5rem;font-weight:800;line-height:1}
.hard{display:grid;grid-template-columns:3.2rem 1fr 6.5rem;gap:.4rem .8rem;align-items:center}
.hard .lbl{font-weight:700}
.hard .hb{height:.9rem;background:#efede8;border-radius:99px;overflow:hidden}
.hard .hb span{display:block;height:100%;background:var(--good)}
.hard .hb span.low{background:var(--bad)}
.hard .hb span.mid{background:var(--warn)}
.hard .pc{text-align:right;font-variant-numeric:tabular-nums}

.center{display:flex;align-items:center;justify-content:center;padding:2rem}
.center .card{max-width:38rem}
.center h1{margin-top:0}
.settings details.adv{margin-top:1rem;border-top:1px solid var(--line);padding-top:.6rem}
.settings details.adv summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600}
@media (max-width:760px){ .libgrid,.lobbygrid{grid-template-columns:1fr} .top{flex-wrap:wrap} }

/* projector window: lobby setting + header chip on the laptop */
.settings .proj{margin:.8rem 0 .2rem;padding:.7rem .8rem;border:1px dashed var(--line);border-radius:10px}
.settings .proj .btn{margin:0 .4rem .3rem 0}
.settings .proj .on{font-weight:700;color:var(--good);margin-right:.5rem}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.proj{background:var(--good-soft);border-color:#a9d8bb}
.mirror{margin:.6rem 1.2rem 0;padding:.5rem .8rem;border-radius:10px;background:var(--bad-soft);color:#6b1d11;font-size:.85rem}
.mirror:empty{margin:0;padding:0}

/* presenter console (laptop) while the projector window is open */
.screen.console{grid-template-rows:auto auto 1fr auto}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1rem;padding:.8rem 1.2rem;min-height:0}
.cleft,.cright{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.6rem}
.cleft .opt{padding:.35rem .7rem}
.ccase{font-size:.9rem;padding:.9rem 1.1rem}
.ccase .nh{font-weight:700;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem}
.ccase figure.qimg img{max-height:26vh}
.ccase .lead{margin-top:.6rem;font-size:.95rem}
.opt.key{border-color:var(--good)}
.opt.key .letter{background:var(--good);color:#fff}
.opt .keytag{font-size:.72rem;font-weight:700;color:var(--good);margin-left:.4rem;white-space:nowrap}
.cright{display:flex;flex-direction:column;gap:.6rem}
.notes{font-size:.88rem;padding:.9rem 1.1rem}
.notes .nh{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.notes .nh h2{margin:0;font-size:1rem;flex:1}
.notes p{margin:.3rem 0}
.notes h3{margin:.8rem 0 .3rem;font-size:.92rem}
.notes .explain ul.why li{padding:.25rem .5rem}
.notes .explain .ans{margin-bottom:.5rem;padding:.4rem .7rem}
.notes .explain .ans b{font-size:1.2rem}
.notes .obj{margin-top:.6rem;padding-top:.5rem}
.nextq{font-size:.85rem;padding:.7rem 1.1rem;color:var(--muted)}
.nextq b{color:var(--ink)}
.status .live{flex-basis:100%;font-size:.8rem;color:var(--good);font-weight:600}

/* projector window (audience view) */
.audjoin{display:flex;gap:3.5vw;align-items:center;justify-content:center;padding:2vh 3vw;min-height:0}
.audjoin .qr{width:min(72vh,46vw);aspect-ratio:1;background:#fff;border-radius:14px;padding:.3rem;flex:none}
.audjoin .qr svg{width:100%;height:100%;display:block}
.audjoin .info{display:flex;flex-direction:column;gap:.8rem;min-width:0;max-width:36rem}
.audjoin .big{font-size:1.5rem}
.audjoin .code{font-size:4.6rem;font-weight:800;letter-spacing:.18em;line-height:1}
.audjoin .check{color:var(--muted);font-size:1.1rem}
.audjoin .check b{color:var(--ink);font-size:1.4rem;letter-spacing:.12em;margin-left:.3rem}
.audjoin .url{color:var(--muted);word-break:break-all;font-size:.95rem}
.audjoin .joined{font-size:2rem}
.fsbtn{position:fixed;right:1rem;bottom:1rem;z-index:20;transition:opacity .4s}
body.idle .fsbtn,body.fs .fsbtn{opacity:0;pointer-events:none}
body.aud.idle{cursor:none}
.awnote{position:fixed;left:50%;top:.8rem;transform:translateX(-50%);z-index:30;background:var(--bad-soft);color:#6b1d11;border-radius:10px;padding:.4rem .9rem;font-size:.9rem;display:none}
.awnote.open{display:block}
</style>
</head>
<body>
<div id="app"></div>
<script>/*__PEERJS__*/</script>
<script>/*__QRCODE__*/</script>
<script>
(function(){
'use strict';
var APP_VERSION = '4';
var LET = 'ABCDEFGH'.split('');
function letters(n){ return LET.slice(0, n); }
var app = document.getElementById('app');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var store = {
  get: function(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
};
var SESSION_KEY = 'livequiz-session-v2', SETTINGS_KEY = 'livequiz-settings-v1';

/* ---------- projector window: a second window of this page (?audience=ID) that shows only what students should see.
   The presenter window runs the quiz and sends it the quiz and the screen state over a BroadcastChannel
   (same browser, same site only); the projector window sends back key presses and clicks. ---------- */
var VIEW_CH = null; try { if (window.BroadcastChannel) VIEW_CH = new BroadcastChannel('livequiz-view'); } catch(e){}
var AUD_ID = (function(){ var a = new URLSearchParams(location.search).get('audience') || ''; return /^[A-Za-z0-9]{6,24}$/.test(a) ? a : ''; })();
var AUD_NAME = 'livequiz-audience';
function toggleFs(){ try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); } catch(e){} }
function audienceBoot(){
  document.title = 'Live Quiz — Projector';
  document.body.classList.add('aud');
  var cur = null, lastView = 0, idleT = null;
  var fsb = document.createElement('button'); fsb.className = 'btn fsbtn'; fsb.setAttribute('data-fs', ''); fsb.textContent = '⛶ Full screen (F)'; document.body.appendChild(fsb);
  var note = document.createElement('div'); note.className = 'awnote'; note.textContent = 'Lost contact with the presenter window…'; document.body.appendChild(note);
  function post(m){ m.id = AUD_ID; try { VIEW_CH.postMessage(m); } catch(e){} }
  function wait(msg){
    if (cur) { cur.dispose(); cur = null; }
    note.classList.remove('open');
    app.innerHTML = '<div class="screen"><header class="top"><div class="title">Live quiz · projector window</div></header><main class="center"><div class="card" id="awaiting"><h1>Projector window</h1>'+
      (msg ? '<p class="warn">'+esc(msg)+'</p>' : '')+
      '<p>Waiting for the presenter window… Start or continue a quiz there.</p>'+
      '<p class="hint">Move this window to the projector screen, then click Full screen. The laptop window runs the quiz and keeps the answers; this window shows only what students should see.</p>'+
      '<p><button class="btn primary big" data-fs>Full screen</button></p></div></main><footer></footer></div>';
  }
  if (!VIEW_CH) { wait('This browser can’t link two windows. Open the player in Chrome or Edge.'); return; }
  wait('');
  VIEW_CH.onmessage = function(e){
    var m = e.data; if (!m || typeof m !== 'object' || m.id !== AUD_ID) return;
    if (m.t === 'pack') {
      if (typeof m.key !== 'string' || (cur && cur.key === m.key)) return;
      if (checkPack(m.quiz).errs.length) return;
      if (cur) cur.dispose();
      cur = runApp(m.quiz, m.key, 'view'); cur.key = m.key; lastView = Date.now();
    } else if (m.t === 'view') {
      if (cur && m.key === cur.key && m.S && typeof m.S === 'object') { lastView = Date.now(); note.classList.remove('open'); cur.apply(m); }
    } else if (m.t === 'bye') wait('The presenter window was closed or reloaded.');
    else if (m.t === 'close') window.close();
  };
  function beat(){ post({ t:'beat', has: cur ? cur.key : '' }); }
  setInterval(beat, 1000); beat();
  setInterval(function(){ if (!cur) return; var gap = Date.now() - lastView; note.classList.toggle('open', gap > 5000); if (gap > 20000) wait('Lost contact with the presenter window.'); }, 1000);
  window.addEventListener('pagehide', function(){ post({ t:'gone' }); });
  document.addEventListener('click', function(e){ if (e.target.closest('[data-fs]')) toggleFs(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFs(); } });
  document.addEventListener('fullscreenchange', function(){ document.body.classList.toggle('fs', !!document.fullscreenElement); });
  function awake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function(){ document.body.classList.add('idle'); }, 3000); }
  document.addEventListener('mousemove', awake); awake();
}

/* ---------- remembered quiz packs (IndexedDB; optional — everything works without it) ---------- */
var idb = (function(){
  var dbp = null;
  function open(){
    if (!dbp) dbp = new Promise(function(res, rej){
      try { var r = indexedDB.open('livequiz', 2);
        r.onupgradeneeded = function(){
          var db = r.result;
          if (!db.objectStoreNames.contains('packs')) db.createObjectStore('packs', { keyPath: 'key' });
          if (!db.objectStoreNames.contains('keys')) db.createObjectStore('keys', { keyPath: 'key' });   // presenter signing key
        };
        r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
      } catch(e){ rej(e); }
    });
    return dbp;
  }

  if (p.description != null && typeof p.description !== 'string') errs.push('The quiz description must be text.');

    if (typeof q.lead !== 'string' || !q.lead.trim()) errs.push(n + 'the question line is missing.');

/* ---------- PeerJS: this page is the hub ---------- */
var reconnectTimer = null, watchdog = null, lastErr = '', busySince = 0;
function startPeer(){

  catch (e) { peer = null; lastErr = (e && e.message) || String(e); peerStatus = 'unreachable'; renderNet(); refreshCounts(); reconnectTimer = setTimeout(startPeer, 5000); return; }
  watchdog = setTimeout(function(){
    if (p !== peer || peerStatus === 'online') return;

  }, 12000);
  p.on('open', function(){ if (p !== peer) return; clearTimeout(watchdog); lastErr = ''; busySince = 0; peerStatus = 'online'; renderNet(); refreshCounts(); });

function setupConn(conn){

  }
  var tOpts = function(sel, list){ return list.map(function(v){ return '<option value="'+v+'"'+(+sel===v?' selected':'')+'>'+(v ? (v+' seconds') : 'No time limit')+'</option>'; }).join(''); };
  app.innerHTML =
    '<div class="screen">'+
      '<header class="top"><div class="title">'+esc(QUIZ.title)+'</div><div class="spacer"></div>'+netHtml()+'</header>'+
      '<main class="lobbygrid">'+
        '<section class="card join" id="join"></section>'+
        '<section class="card settings">'+
          '<div class="pack"><b>'+esc(QUIZ.title)+'</b><span>'+TOTAL+' questions</span><button class="btn small" data-act="edit" id="editBtn">Edit</button><button class="btn small" data-act="change" id="changeBtn">Change quiz</button></div>'+
          (WARNS && WARNS.length ? '<small class="warn">'+esc(WARNS.slice(0,3).join(' '))+(WARNS.length>3?' …':'')+'</small>' : '')+
          '<div class="proj" id="projrow"></div>'+
          '<div class="row"><div><label for="t1">Time per question</label><select id="t1" data-set="t1">'+tOpts(settings.t1,[30,45,60,90,120,180,0])+'</select></div>'+
          '<div><label for="t2">Revote time</label><select id="t2" data-set="t2">'+tOpts(settings.t2,[30,45,60,90,0])+'</select></div></div>'+
          '<label class="check"><input type="checkbox" data-set="autoClose"'+(settings.autoClose?' checked':'')+'> Close voting automatically when every connected student has answered</label>'+
          '<label class="check"><input type="checkbox" data-set="confidence"'+(settings.confidence?' checked':'')+'> Ask “sure or guessing?” with each answer</label>'+
          '<label for="sa">Start at question</label><input id="sa" type="number" min="1" max="'+TOTAL+'" data-set="startAt" value="'+Math.min(TOTAL, settings.startAt||1)+'">'+
          '<button class="btn primary big" data-act="start" id="startBtn">Start quiz ▶</button>'+
          '<details class="adv" id="adv"'+(joinUrl() ? '' : ' open')+'><summary>Advanced</summary>'+
            '<label for="su">Phone page address</label><input id="su" type="url" data-set="studentUrl" placeholder="https://your-name.github.io/live-quiz/join/" value="'+esc(settings.studentUrl)+'">'+
            '<small>Where the phone page is online; the QR code and the link open it. It fills itself in (this site’s join/ address), so there is normally nothing to change.</small></details>'+
          '<p class="hint">Keep this tab open and the computer awake until the end. Keys: Enter, Space, → or a clicker’s Next = next step, D = revote, + = 30 more seconds, Q = show QR. Ctrl + / Ctrl − changes text size.</p>'+
        '</section>'+
      '</main>'+
    '</div>';
  updateLobby(); renderProj();
}
function updateLobby(){
  var el = document.getElementById('join'); if (!el || S.phase !== 'lobby') return;
  var u = joinUrl(), n = onlineN(), warn = '';
  if (VIEW) {
    var joined = '<b>'+n+'</b> student'+(n===1?'':'s')+' connected';
    if (el.getAttribute('data-u') === u + '|' + S.code) { var j = document.getElementById('joined'); if (j) j.innerHTML = joined; return; }
    el.setAttribute('data-u', u + '|' + S.code);
    el.innerHTML = (u ? '<div class="qr" id="qr">'+qrSvg(u)+'</div>' : '') + '<div class="info">'+
      (u ? '<div class="big">Scan the QR code with your phone camera to join</div><div>or open the link below and enter the code</div>'
         : '<p class="warn">The phone page address is missing. Add it under Advanced in the lobby on the laptop.</p><div>Code</div>')+
      '<div class="code" id="code">'+esc(S.code)+'</div>'+
      '<div class="check">check code <b id="check">'+esc(checkPretty())+'</b></div>'+
      (u ? '<div class="url">'+esc(u)+'</div>' : '')+
      '<div class="joined" id="joined">'+joined+'</div></div>';
    return;
  }
  if (!u) warn = '<p class="warn">Add the phone page address under Advanced (right) to show the QR code.</p>';
  else if (peerStatus === 'unreachable') warn = '<p class="warn" id="neterr">Can’t reach the PeerJS server ('+esc(lastErr)+'). Retrying… If this doesn’t clear, open this page from its https address in Chrome, or check that the network allows it.</p>';
  else if (peerStatus !== 'online') warn = '<p class="hint">Connecting to the PeerJS server… phones can join once the corner shows “Live”.</p>';
  el.innerHTML = (u ? '<div class="qr" id="qr">'+qrSvg(u)+'</div>' : '') + warn +
    '<div>Scan to join · or enter code</div><div class="code" id="code">'+esc(S.code)+'</div>'+
    '<div class="check">check code <b id="check">'+esc(checkPretty())+'</b></div>'+
    (u ? '<div class="url">'+esc(u)+'</div><button class="btn small" data-act="copylink" id="copyBtn">Copy link</button>' : '') +
    '<div class="joined" id="joined"><b>'+n+'</b> student'+(n===1?'':'s')+' connected</div>';
}

function stemHtml(stem){
  var html = '', list = [];
  function flush(){ if (list.length) { html += '<ul>' + list.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('') + '</ul>'; list = []; } }
  String(stem).split('\n').forEach(function(ln){ if (ln.indexOf('• ') === 0) list.push(ln.slice(2)); else { flush(); if (ln.trim()) html += '<p>'+esc(ln)+'</p>'; } });
  flush(); return html;
}
function figHtml(id, cap){ if (!hasImg(id)) return ''; return '<figure class="qimg"><img src="'+IMAGES[id]+'" alt="'+esc(cap || 'Image')+'" data-zoom="'+esc(id)+'" title="Click to enlarge">'+(cap ? '<figcaption>'+esc(cap)+'</figcaption>' : '')+'</figure>'; }
function buildQuestion(){                           // the projector screen (one window, or the projector window)
  app.innerHTML =
    '<div class="screen">'+
      '<header class="top"><div class="qnum">Question '+(S.qi+1)+'<span>of '+TOTAL+'</span></div>'+
      (S.round === 2 ? '<div class="badge r2">Round 2 · revote after discussion</div>' : '')+
      '<div class="spacer"></div>'+
      (!VIEW && VIEW_CH ? '<button class="chip" data-act="audience" id="audChip" title="Open a second window for the projector; this laptop then shows a presenter view">🖥 Projector window</button>' : '')+
      '<button class="chip" data-act="qr" title="Show QR code (Q)">Join code <b>'+esc(S.code)+'</b></button>'+
      '<span class="chip" id="online"></span>'+netHtml()+'</header>'+
      '<main class="grid"><section class="left" id="left"></section>'+
      '<section class="right"><div class="status" id="status"></div><div class="opts" id="opts"></div></section></main>'+
      (VIEW ? '<footer></footer>' : '<footer class="controls" id="controls"></footer>')+
    '</div>' + qrOverlay();
  renderLeft(); updateQuestion();
}
function topWrong(qi){
  var q = QUESTIONS[qi], ls = LQ(qi), t = tallyOf(finalBucket(qi), qi), best = null, max = 0;
  t.opts.forEach(function(o,i){ if (ls[i] !== q.answer && o.all > max) { max = o.all; best = ls[i]; } });
  return best;
}
function explainHtml(){
  var q = QUESTIONS[S.qi], ls = LQ(S.qi), why = q.why || {};
  var tw = topWrong(S.qi), wl = ls.filter(function(l){ return l !== q.answer && why[l]; });
  return '<div class="ans">Correct answer <b>'+q.answer+'</b><span>'+esc(q.options[ls.indexOf(q.answer)])+'</span></div>'+
    (q.explain ? '<p>'+esc(q.explain)+'</p>' : '') + figHtml(q.explainImage, q.explainCaption) +
    (wl.length ? '<h3>Why not the others</h3><ul class="why">'+
      wl.map(function(l){ return '<li'+(l===tw?' class="top"':'')+'><b>'+l+'</b>'+esc(why[l])+(l===tw?'<em class="tag">most chosen wrong answer</em>':'')+'</li>'; }).join('')+'</ul>' : '')+
    (q.objective ? '<p class="obj"><b>Take-home:</b> '+esc(q.objective)+'</p>' : '');
}
function renderLeft(){
  var el = document.getElementById('left'); if (!el) return;
  var q = QUESTIONS[S.qi];
  if (S.phase === 'reveal' && !showStem) {
    el.innerHTML = '<div class="explain">'+explainHtml()+(VIEW ? '' : '<button class="link" data-act="togglestem">Show the question again</button>')+'</div>';
  } else {
    el.innerHTML = '<div class="stem">'+stemHtml(q.stem)+'</div>'+figHtml(q.image, q.imageCaption)+'<p class="lead">'+esc(q.lead)+'</p>'+
      (S.phase === 'reveal' && !VIEW ? '<button class="link" data-act="togglestem">Back to the explanation</button>' : '');
  }
  el.scrollTop = 0;
}
function fmt(ms){ var s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function statusHtml(con){                           // con: the laptop's presenter view, which sees live results
  var q = QUESTIONS[S.qi], ls = LQ(S.qi), on = onlineN(), n = Object.keys(peekBucket(S.qi, S.round)).length;
  var legend = settings.confidence ? '<span class="legend"><span>sure</span><span class="g">guessing</span></span>' : '';
  if (S.phase === 'vote') {
    return '<div class="count"><b>'+n+'</b> of '+on+' answered</div>' +
      (S.deadline ? '<div class="timer" id="timer">'+fmt(S.deadline - Date.now())+'</div><div class="tbar"><span id="tfill"></span></div>' : '<div class="timer">no limit</div>') +
      (con ? '<div class="live">Live results below are only on this laptop. The projector keeps them hidden until you close voting.</div>' : '<div class="note">Results stay hidden until voting closes.</div>');
  }
  if (S.phase === 'closed') return '<div class="count">Voting closed · <b>'+n+'</b> answer'+(n===1?'':'s')+'</div>'+legend;
  var fb = finalBucket(S.qi), t = tallyOf(fb, S.qi), k = t.opts[ls.indexOf(q.answer)].all, cw = 0;
  for (var sid in fb) if (fb[sid].c !== q.answer && fb[sid].sure === true) cw++;
  return '<div class="count"><b>'+(t.n ? Math.round(k*100/t.n) : 0)+'%</b> correct ('+k+' of '+t.n+')</div>' +
    (settings.confidence && t.n ? '<div class="chip">'+cw+' sure but wrong</div>' : '') + legend;
}
function optsHtml(bars, mark){                      // mark: 'reveal' = correct green, others dimmed; 'key' = answer marked for the presenter only
  var q = QUESTIONS[S.qi], ls = LQ(S.qi);
  var tally = tallyOf(S.phase === 'reveal' ? finalBucket(S.qi) : peekBucket(S.qi, S.round), S.qi);
  var t1 = S.round === 2 ? tallyOf(peekBucket(S.qi, 1), S.qi) : null;
  return q.options.map(function(o, i){
    var right = ls[i] === q.answer;
    var cls = 'opt' + (mark === 'reveal' ? (right ? ' correct' : ' dim') : (mark === 'key' && right ? ' key' : ''));
    var b = '', count = '';
    if (bars) {
      var d = tally.n || 1, ti = tally.opts[i];
      b = (t1 ? '<div class="ghost" title="Round 1"><span style="width:'+(t1.n ? t1.opts[i].all*100/t1.n : 0)+'%"></span></div>' : '') +
        '<div class="bar"><span class="s" style="width:'+(ti.s*100/d)+'%"></span><span class="g" style="width:'+(ti.g*100/d)+'%"></span></div>';
      count = '<div class="ocount"><b>'+(tally.n ? Math.round(ti.all*100/tally.n) : 0)+'%</b><small>'+ti.all+'</small>'+(t1 ? '<div class="r1">R1 '+(t1.n ? Math.round(t1.opts[i].all*100/t1.n) : 0)+'%</div>' : '')+'</div>';
    }
    return '<div class="'+cls+'" data-l="'+ls[i]+'"><div class="letter">'+ls[i]+'</div><div class="otext">'+esc(o)+(mark === 'key' && right ? '<span class="keytag">✓ answer</span>' : '')+b+'</div>'+count+'</div>';
  }).join('');
}
function updateQuestion(){
  if (!S || ['vote','closed','reveal'].indexOf(S.phase) < 0) return;
  var onEl = document.getElementById('online'); if (onEl) onEl.innerHTML = '👥 <b>'+onlineN()+'</b> connected';
  var st = document.getElementById('status'), op = document.getElementById('opts'); if (!st || !op) return;
  st.innerHTML = statusHtml(false); tickTimer(true);
  op.innerHTML = optsHtml(S.phase !== 'vote', S.phase === 'reveal' ? 'reveal' : '');
  updateControls();
}

/* ---------- presenter view on the laptop (while the projector window is open) ---------- */
function ansShown(){ return S.phase === 'reveal' || (peek === null ? (window.screen && screen.isExtended === true) : peek); }
function nextHtml(){
  if (S.qi >= TOTAL-1) return '<b>Last question.</b> Next comes the class results screen.';
  var s = String(QUESTIONS[S.qi+1].stem).replace(/\n• /g, '; ').replace(/\s+/g, ' ').trim();
  return '<b>Next · Question '+(S.qi+2)+':</b> '+esc(s.length > 170 ? s.slice(0, 168) + '…' : s);
}
function notesHtml(){
  var head = '<div class="nh"><h2>Answer and teaching notes</h2>' + (S.phase === 'reveal' ? '' : '<button class="btn small" data-act="peek" id="peekBtn">'+(ansShown() ? 'Hide answer' : 'Show answer')+'</button>') + '</div>';
  if (!ansShown()) return head + '<p class="hint">Hidden on this screen. Press “Show answer” when only you can see this laptop.</p>';
  return head + '<div class="explain">' + explainHtml() + '</div>';
}
function buildConsole(){
  var q = QUESTIONS[S.qi];
  var kase = '<div class="card ccase" id="ccase"><div class="nh">The case</div><div class="stem">'+stemHtml(q.stem)+'</div>'+figHtml(q.image, q.imageCaption)+'<p class="lead">'+esc(q.lead)+'</p></div>';
  var notes = '<div class="card notes" id="notes"></div>';
  app.innerHTML =
    '<div class="screen console">'+
      '<header class="top"><div class="qnum">Question '+(S.qi+1)+'<span>of '+TOTAL+'</span></div>'+
      (S.round === 2 ? '<div class="badge r2">Round 2</div>' : '')+
      '<span class="chip proj" id="projchip"></span><div class="spacer"></div>'+
      '<button class="chip'+(qrOpen ? ' on' : '')+'" data-act="qr" id="qrchip" title="Show or hide the QR code on the projector (Q)">Join code <b>'+esc(S.code)+'</b></button>'+
      '<span class="chip" id="online"></span>'+netHtml()+'</header>'+
      '<div class="mirror" id="mirror">'+mirrorHtml()+'</div>'+
      // left: what is happening now (live results, the answer marked); right: the case and the notes,
      // the case first while students vote and the notes first after the reveal
      '<main class="cgrid"><section class="cleft" id="cleft"><div class="status" id="status"></div><div class="opts" id="copts"></div><div class="card nextq" id="nextq">'+nextHtml()+'</div></section>'+
      '<section class="cright" id="cright">'+(S.phase === 'reveal' ? notes + kase : kase + notes)+'</section></main>'+
      '<footer class="controls" id="controls"></footer>'+
    '</div>';
  notesKey = ''; updateConsole(); renderProjChip();
}
function updateConsole(){
  if (!S || ['vote','closed','reveal'].indexOf(S.phase) < 0) return;
  var onEl = document.getElementById('online'); if (onEl) onEl.innerHTML = '👥 <b>'+onlineN()+'</b> connected';
  var st = document.getElementById('status'), op = document.getElementById('copts'), ne = document.getElementById('notes'); if (!st || !op) return;
  st.innerHTML = statusHtml(true); tickTimer(true);
  op.innerHTML = optsHtml(true, S.phase === 'reveal' ? 'reveal' : (ansShown() ? 'key' : ''));
  var nk = ansShown() + ':' + S.phase + ':' + topWrong(S.qi);
  if (ne && nk !== notesKey) { notesKey = nk; ne.innerHTML = notesHtml(); }
  updateControls(); renderProjChip();
}
function updateControls(){
  var el = document.getElementById('controls'); if (!el) return;
  var con = consoleOn();
  var left = '<button class="btn danger" data-act="end">'+(isArmed('end') ? 'Click again to end the quiz' : 'End quiz')+'</button>'+
    (con ? '<button class="btn" data-act="closeaud" id="closeAudBtn">Close projector window</button>' : '')+'<div class="spacer"></div>';
  var right = '';
  if (S.phase === 'vote') right = (S.deadline ? '<button class="btn" data-act="more">+30 s<kbd>+</kbd></button>' : '') + '<button class="btn primary" data-act="close">Close voting<kbd>Enter</kbd></button>';
  else if (S.phase === 'closed') right = (S.round === 1 ? '<button class="btn" data-act="revote">Discuss &amp; revote<kbd>D</kbd></button>' : '') + '<button class="btn primary" data-act="reveal">Reveal answer<kbd>Enter</kbd></button>';
  else if (S.phase === 'reveal') right = (con ? '<button class="btn" data-act="togglestem" id="stemBtn">'+(showStem ? 'Projector: back to the explanation' : 'Projector: show the question again')+'</button>' : '') +
    '<button class="btn primary" data-act="next">'+(S.qi < TOTAL-1 ? 'Next question' : 'Finish &amp; show results')+'<kbd>Enter</kbd></button>';
  el.innerHTML = left + right;
}
function tickTimer(displayOnly){
  if (!S || S.phase !== 'vote' || !S.deadline) return;
  var left = S.deadline - Date.now();
  if (left <= 0) { if (!displayOnly && !VIEW) closeVoting(); return; }
  var t = document.getElementById('timer'), f = document.getElementById('tfill');
  if (t) { t.textContent = fmt(left); t.classList.toggle('low', left <= 10000); }
  if (f && S.dur) f.style.width = Math.max(0, Math.min(100, left*100/(S.dur*1000))) + '%';
}
every(function(){ tickTimer(false); }, 250);
every(function(){ if (S) { refreshCounts(); maybeAutoClose(); } }, 2500);

function buildEnd(){
  var rows = S.played.map(function(qi){ var t = tallyOf(finalBucket(qi), qi), k = t.opts[LQ(qi).indexOf(QUESTIONS[qi].answer)].all; return { qi: qi, n: t.n, pc: t.n ? k*100/t.n : 0 }; });
  var withVotes = rows.filter(function(r){ return r.n; });
  var avg = withVotes.length ? withVotes.reduce(function(a,r){ return a + r.pc; }, 0) / withVotes.length : 0;
  rows.sort(function(a,b){ return a.pc - b.pc; });
  app.innerHTML =
    '<div class="screen"><header class="top"><div class="title">'+esc(QUIZ.title)+' · results</div><div class="spacer"></div>'+netHtml()+'</header>'+
    '<main class="endgrid"><section class="card"><div class="avg">'+Math.round(avg)+'%</div><p>class average · '+everyoneN()+' students · '+S.played.length+' questions</p>'+
    '<p class="hint">Each student now sees their own score on their phone. Nobody else sees it.</p>'+
    (VIEW ? '' :
    '<p><button class="btn primary" data-act="csv">Download results (CSV)</button></p>'+
    '<p><button class="btn" data-act="newsession">'+(isArmed('new') ? 'Click again — this clears these results' : 'Run this quiz again (new session)')+'</button></p>'+
    '<p><button class="btn" data-act="change">'+(isArmed('change') ? 'Click again — this clears these results' : 'Load another quiz')+'</button></p>')+'</section>'+
    '<section class="card"><h2 style="margin-top:0">Questions by % correct (hardest first)</h2><div class="hard">'+
    rows.map(function(r){ var c = r.pc < 50 ? 'low' : r.pc < 70 ? 'mid' : ''; return '<div class="lbl">Q'+(r.qi+1)+'</div><div class="hb"><span class="'+c+'" style="width:'+r.pc+'%"></span></div><div class="pc">'+Math.round(r.pc)+'% <small>('+r.n+')</small></div>'; }).join('')+
    '</div></section></main>'+(VIEW ? '<footer></footer>' : '<footer class="controls"></footer>')+'</div>';
}
function downloadCsv(){
  var maxN = S.played.reduce(function(m, qi){ return Math.max(m, QUESTIONS[qi].options.length); }, 0), LS = letters(maxN);
  var head = ['Question','Correct','R1 answered','R1 % correct'].concat(LS.map(function(l){ return 'R1 '+l; }), ['R2 answered','R2 % correct'], LS.map(function(l){ return 'R2 '+l; }), ['Final answered','Final % correct','Sure but wrong']);
  var lines = ['"' + String(QUIZ.title).replace(/"/g,'""') + '"', head.join(',')];
  S.played.forEach(function(qi){
    var q = QUESTIONS[qi], ai = LQ(qi).indexOf(q.answer), row = [qi+1, q.answer];
    [1,2].forEach(function(r){ var t = tallyOf(peekBucket(qi, r), qi); row.push(t.n, t.n ? Math.round(t.opts[ai].all*100/t.n) : ''); LS.forEach(function(l, i){ row.push(t.opts[i] ? t.opts[i].all : ''); }); });
    var fb = finalBucket(qi), tf = tallyOf(fb, qi), cw = 0; for (var s in fb) if (fb[s].c !== q.answer && fb[s].sure === true) cw++;
    row.push(tf.n, tf.n ? Math.round(tf.opts[ai].all*100/tf.n) : '', cw);
    lines.push(row.join(','));
  });
  var blob = new Blob([lines.join('\n')], { type:'text/csv' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'quiz-results-' + String(QUIZ.title).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40) + '-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- start ---------- */
if (VIEW) return { apply: applyView, dispose: function(){ offs.forEach(function(f){ try { f(); } catch(e){} }); offs = []; } };
if (VIEW_CH) VIEW_CH.addEventListener('message', onViewMsg);
window.addEventListener('pagehide', function(){ if (audienceOn()) vsend({ t:'bye' }); });
try { if (window.screen && screen.addEventListener) screen.addEventListener('change', onScreenChange); } catch(e){}
every(audCheck, 1000);
hashImages().then(function(){
  if (MODE === 'resume') {
    S = store.get(SESSION_KEY); S.answers = S.answers || {}; S.played = S.played || []; S.everyone = S.everyone || {}; conns = {};
    if (S.phase === 'vote' && S.deadline && S.deadline < Date.now()) { S.phase = 'closed'; S.deadline = null; save(); }
    loadKeys(true).then(function(fresh){
      // The session key is kept in this browser. If it is gone, phones would (rightly) refuse this screen,
      // so move to a new code and show the QR for everyone to scan again.
      if (fresh) { S.code = makeCode(); save(); saveKeys(); qrOpen = true; }
      startPeer(); render(true);
    }, keyFailure);
  } else {
    store.del(SESSION_KEY); newSession();
  }
}, keyFailure);
}
})();
</script>
