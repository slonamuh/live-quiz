<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<title>Live Quiz</title>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#15171c; --muted:#5b616d; --line:#d9d6ce;
  --accent:#2350b8; --accent-soft:#dbe4f8; --good:#16804a; --good-soft:#d7efe0; --bad:#b93a27; --bad-soft:#f6ddd8; --warn-soft:#fbe9c6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161a; --panel:#1d2026; --ink:#eceae5; --muted:#a3a8b3; --line:#343842;
    --accent:#6f95f0; --accent-soft:#25335a; --good:#4cc283; --good-soft:#173826; --bad:#f07a66; --bad-soft:#40211c; --warn-soft:#3d3015; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.wrap{max-width:40rem;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
header .t{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:#c58b1b;flex:none}
.dot.ok{background:var(--good)} .dot.err{background:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.low{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.center{text-align:center;padding:40px 8px}
.center .big{font-size:1.5rem;font-weight:800;margin:.3em 0}
.muted{color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{border-radius:12px;padding:12px 14px;margin:14px 0;font-weight:600}
.banner.r2{background:var(--warn-soft)}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.qhead b{font-size:1.1rem}
.stem p{margin:0 0 .6em}
.stem ul{margin:.2em 0 .7em 1.1em;padding:0}
.lead{font-weight:700;margin:.8em 0 0}
.opts{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt .l{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line)}
.opt .x{padding-top:4px;min-width:0}
.stem,.lead,.opt .x,figcaption,.explain,.banner,.center{overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.fade{opacity:.6}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.dock .in{max-width:40rem;margin:0 auto;display:flex;gap:10px}
.dock button{flex:1;min-height:54px;border-radius:12px;border:0;font-weight:700;font-size:1.05rem;background:var(--accent);color:#fff;cursor:pointer}
.dock button.alt{background:var(--panel);color:var(--ink);border:2px solid var(--accent)}
.dock button:disabled{opacity:.4;cursor:default}
.dock .msg{flex:1;text-align:center;font-weight:600;padding:8px 0}
.explain h3{margin:16px 0 6px;font-size:1rem}
.why{list-style:none;margin:0;padding:0}
.why li{padding:8px 10px;border-radius:10px;margin:4px 0}
.why li.mine{background:var(--bad-soft)}
.why b{display:inline-block;width:1.4em}
.obj{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
figure.qimg{margin:10px 0 12px;text-align:center}
figure.qimg img{max-width:100%;max-height:55vh;border-radius:8px;border:1px solid var(--line);background:#fff}
figure.qimg figcaption{color:var(--muted);font-size:.85rem;margin-top:4px}
.imgload{padding:28px 10px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);overflow:auto;display:flex;align-items:center;justify-content:center}
.zoom img{max-width:none;width:auto;min-width:100%;height:auto;background:#fff}
.zoom .x{position:fixed;top:10px;right:12px;background:#fff;color:#000;border:0;border-radius:50%;width:40px;height:40px;font-size:22px;font-weight:700}
.score{font-size:3.2rem;font-weight:800;line-height:1}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center}
.res .ok{color:var(--good);font-weight:800}
.res .no{color:var(--bad);font-weight:800}
.join label{display:block;text-align:left;font-weight:600;margin:12px 0 4px}
.join input{width:100%;font-size:1.6rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--panel)}
.bad{color:var(--bad)}
.big.bad{font-size:1.4rem}
.small{font-size:.85rem}
.join button{width:100%;margin-top:12px;min-height:54px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:1.1rem}
/* lab values sheet (NBME reference values), opened from the header during a question */
.labbtn{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;cursor:pointer}
.labbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.labsheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.labsheet .in{max-width:40rem;margin:0 auto;padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.labsheet input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px}
.labtabs{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.labtabs button{flex:1;min-width:4.5rem;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 6px;font-weight:600;font-size:.9rem;cursor:pointer}
.labtabs button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.labtabs.dim button{opacity:.45}
.labg{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.labr{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.labr .v{text-align:right;font-weight:700;white-space:nowrap}
.labr .tab{font-size:.75rem;color:var(--muted);display:block}
.labsrc{font-size:.75rem;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><span class="t" id="ht">Live quiz</span><span class="timer" id="tm"></span><button class="labbtn" id="labBtn" type="button" hidden aria-expanded="false">Labs</button></header>
<div class="labsheet" id="lab" hidden role="dialog" aria-label="Laboratory reference values"></div>
<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden></div>
<script>/*__PEERJS__*/</script>
<script>
(function(){
'use strict';
var L = 'ABCDEFGH'.split('');
var imgs = {};
var IMG_RE = /^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,[A-Za-z0-9+\/=]+$/;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ---------- crypto helpers ---------- */
var HAS_CRYPTO = !!(window.crypto && crypto.subtle && crypto.getRandomValues && window.TextEncoder);
function enc(t){ return new TextEncoder().encode(t); }
function b64u(buf){ var b = new Uint8Array(buf), s = ''; for (var i=0;i<b.length;i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ s = String(s).replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; var bin = atob(s), u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
function b32(bytes){ var A = '0123456789ABCDEFGHJKMNPQRSTVWXYZ', bits = 0, val = 0, out = ''; for (var i=0;i<bytes.length;i++){ val = (val << 8) | bytes[i]; bits += 8; while (bits >= 5) { out += A[(val >>> (bits - 5)) & 31]; bits -= 5; } } return out; }
function normCheck(v){ return String(v || '').toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '').slice(0, 8); }
function randomId(n){ var b = new Uint8Array(n); crypto.getRandomValues(b); return b64u(b); }

/* ---------- address ----------
   ?s=CODE  plus  #k=<fingerprint of the teacher's key>  (QR code or shared link)
            or    #c=<8-character check code>           (typed by hand)          */
var params = new URLSearchParams(location.search);
var frag = new URLSearchParams(location.hash.replace(/^#/, ''));
var CODE = (params.get('s') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
var FP = (frag.get('k') || '').replace(/[^A-Za-z0-9_-]/g, '');
if (FP.length !== 22) FP = '';
var CHK = normCheck(frag.get('c'));
if (CHK.length !== 8) CHK = '';
var peerOpts = { debug: 0 };
if (/^(127\.0\.0\.1|localhost)$/.test(params.get('ph') || '')) {          // another relay only for local testing
  peerOpts.host = params.get('ph');
  if (params.get('pp')) peerOpts.port = +params.get('pp');
  if (params.get('ps')) peerOpts.secure = params.get('ps') === '1';
  if (params.get('pt')) peerOpts.path = params.get('pt');
}
var ID_PREFIX = 'acsom-livequiz-';

var app = document.getElementById('app'), dock = document.getElementById('dock');
var peer = null, conn = null, status = 'connecting', st = null, lastRx = 0;
var sel = null, selKey = '', pending = null, deadline = null, retryTimer = null;

if (!HAS_CRYPTO) { app.innerHTML = '<div class="center"><div class="big">This browser can’t join safely</div><p class="muted">Please open the link in an up-to-date Chrome or Safari.</p></div>'; return; }
if (!CODE || (!FP && !CHK)) { renderJoin(); return; }

var SID_KEY = 'livequiz-sid-' + CODE;
var sid = lsGet(SID_KEY);
if (!sid || !/^[A-Za-z0-9]{6,40}$/.test(sid)) { sid = randomId(18).replace(/[^A-Za-z0-9]/g, 'x'); lsSet(SID_KEY, sid); }

/* ---------- connection ---------- */
function setStatus(s){ status = s; var d = document.getElementById('dot'); d.className = 'dot' + (s === 'connected' ? ' ok' : s === 'untrusted' ? ' err' : ''); if (!st || s !== 'connected') render(); }
function startPeer(){
  if (peer) { try { peer.destroy(); } catch(e){} }
  var p = peer = new peerjs.Peer(peerOpts);
  p.on('open', function(){ if (p === peer) openConn(); });
  p.on('disconnected', function(){ if (p !== peer || p.destroyed) return; setTimeout(function(){ if (p === peer && !p.destroyed && p.disconnected) { try { p.reconnect(); } catch(e){ retry(2000, true); } } }, 1500); });
  p.on('error', function(err){
    if (p !== peer) return;
    if (err && err.type === 'peer-unavailable') { if (status !== 'untrusted') setStatus('waiting'); retry(3000); return; }
    if (status !== 'untrusted') setStatus('reconnecting');
    retry(3000, true);
  });
}
function openConn(){
  if (conn) { try { conn.close(); } catch(e){} }
  if (status !== 'waiting' && status !== 'untrusted') setStatus(st ? 'reconnecting' : 'connecting');
  var c = conn = peer.connect(ID_PREFIX + CODE.toLowerCase(), { reliable: true, serialization: 'json' });
  c._chain = Promise.resolve(); c._ok = false; c._seq = 0; c._nonce = randomId(16);
  var guard = setTimeout(function(){ if (c === conn && !c.open) retry(500); }, 9000);
  c.on('open', function(){
    if (c !== conn) return; clearTimeout(guard); lastRx = Date.now();
    c.send({ t:'hello', sid: sid, nonce: c._nonce });       // the screen must sign this random challenge
    if (status !== 'untrusted') setStatus('verifying');
    setTimeout(function(){ if (c === conn && c.open && !c._ok) untrusted(c); }, 10000);   // a screen that can't prove itself
  });
  c.on('data', function(m){ if (c !== conn) return; lastRx = Date.now(); c._chain = c._chain.then(function(){ return onMsg(c, m); }).catch(function(){}); });
  c.on('close', function(){ if (c === conn && status !== 'untrusted') { setStatus('reconnecting'); retry(1500); } });
  c.on('error', function(){ if (c === conn && status !== 'untrusted') retry(1500); });
}
function retry(ms, newPeer){
  clearTimeout(retryTimer);
  retryTimer = setTimeout(function(){
    if (newPeer || !peer || peer.destroyed) { startPeer(); return; }
    if (peer.disconnected) { try { peer.reconnect(); } catch(e){ startPeer(); return; } retry(2500); return; }
    if (!peer.open) { retry(1500); return; }
    openConn();
  }, ms);
}
setInterval(function(){
  if (conn && conn.open && conn._ok) {
    try { conn.send({ t:'hb' }); } catch(e){}
    if (Date.now() - lastRx > 17000) { setStatus('reconnecting'); retry(0); }
  }
}, 5000);
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') { wake(); if (!conn || !conn.open) retry(0); }
});

/* keep the screen awake while the quiz runs (where supported) */
var lock = null;
function wake(){ try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !lock) navigator.wakeLock.request('screen').then(function(l){ lock = l; l.addEventListener('release', function(){ lock = null; }); }).catch(function(){}); } catch(e){} }
document.addEventListener('click', wake, { once: true });

/* ---------- messages: nothing is shown until the screen has proven it holds the teacher's key ---------- */
function onMsg(c, m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'pong') return;
  if (m.t === 'auth') return verifyScreen(c, m);
  if (!c._ok) return;
  if (m.t === 's') return onSigned(c, m);
  if (m.t === 'img') return onImg(m);
}
function verifyScreen(c, m){
  if (c._ok || typeof m.pub !== 'string' || typeof m.sig !== 'string' || m.pub.length > 200 || m.sig.length > 200) return untrusted(c);
  var raw, fp;
  try { raw = unb64u(m.pub); } catch(e){ return untrusted(c); }
  return crypto.subtle.digest('SHA-256', raw).then(function(h){
    fp = b64u(h.slice(0, 16));
    var check = b32(new Uint8Array(h).slice(0, 5));
    if (FP ? fp !== FP : check !== CHK) throw new Error('not the key from the QR code / check code');
    return crypto.subtle.importKey('raw', raw, { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
  }).then(function(key){
    return crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, key, unb64u(m.sig), enc('livequiz-auth|' + CODE + '|' + c._nonce)).then(function(ok){
      if (!ok) throw new Error('bad signature');
      c._key = key; c._ok = true;
      if (!FP) { FP = fp; try { history.replaceState(null, '', location.pathname + location.search + '#k=' + fp); } catch(e){} }
      setStatus('connected');
      if (pending) sendAnswer();
    });
  }).catch(function(){ untrusted(c); });
}
function untrusted(c){
  c._ok = false; try { c.close(); } catch(e){}
  deadline = null;
  setStatus('untrusted');
  retry(10000);                     // keep checking: the real screen may come back
}
function onSigned(c, m){
  if (!isInt(m.seq, 1, 1e12) || m.seq <= c._seq || typeof m.body !== 'string' || m.body.length > 300000 || typeof m.sig !== 'string' || m.sig.length > 200) return;
  var seq = m.seq;
  return crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, c._key, unb64u(m.sig), enc(CODE + '|' + c._nonce + '|' + seq + '|' + m.body)).then(function(ok){
    if (!ok || seq <= c._seq) return;
    c._seq = seq;
    var obj; try { obj = JSON.parse(m.body); } catch(e){ return; }
    var s = cleanState(obj); if (s) onState(s);
  });
}
function onImg(m){
  if (typeof m.id !== 'string' || m.id.length > 300 || typeof m.d !== 'string' || m.d.length > 20000 || !isInt(m.n, 1, 400) || !isInt(m.i, 0, m.n - 1)) return;
  var e = imgs[m.id] || (imgs[m.id] = { n: m.n, parts: [], got: 0, data: null, hash: null });
  if (e.data || e.n !== m.n) return;
  if (e.parts[m.i] == null) { e.parts[m.i] = m.d; e.got++; }
  if (e.got !== e.n) return;
  var u = e.parts.join(''); e.parts = null;
  if (!IMG_RE.test(u)) { delete imgs[m.id]; return; }
  return crypto.subtle.digest('SHA-256', enc(u)).then(function(h){ e.data = u; e.hash = b64u(h); if (st) render(); });
}

/* ---------- strict checks on everything the screen sends ---------- */
function isInt(x, lo, hi){ return typeof x === 'number' && isFinite(x) && Math.floor(x) === x && x >= lo && x <= hi; }
function str(x, max){ if (typeof x !== 'string' || x.length > max) throw 0; return x; }
function optStr(x, max){ return x == null ? '' : str(x, max); }
function letter(x){ if (typeof x !== 'string' || !/^[A-H]$/.test(x)) throw 0; return x; }
function answerOf(a){ if (a == null) return null; if (typeof a !== 'object') throw 0; if (!(a.sure === true || a.sure === false || a.sure == null)) throw 0; return { c: letter(a.c), sure: a.sure == null ? null : a.sure }; }
function imageOf(im){ if (im == null) return null; if (typeof im !== 'object') throw 0; return { id: str(im.id, 300), caption: optStr(im.caption, 500), hash: str(im.hash, 64) }; }
function cleanState(m){
  try {
    if (!m || m.t !== 'state' || ['lobby','vote','closed','reveal','end'].indexOf(m.phase) < 0) return null;
    if (!isInt(m.qi, -1, 9999) || !isInt(m.total, 1, 10000)) return null;
    var o = { t:'state', phase: m.phase, title: optStr(m.title, 300), qi: m.qi, total: m.total, round: m.round === 2 ? 2 : 1, confidence: m.confidence === true };
    if (m.phase === 'vote' || m.phase === 'closed' || m.phase === 'reveal') {
      var q = m.q;
      if (!q || typeof q !== 'object' || !Array.isArray(q.options) || q.options.length < 2 || q.options.length > 8) return null;
      o.q = { stem: str(q.stem, 20000), lead: str(q.lead, 2000), options: q.options.map(function(x){ return str(x, 1000); }), image: imageOf(q.image) };
      o.mine = answerOf(m.mine); o.first = answerOf(m.first);
      if (m.remaining != null) { if (!isInt(m.remaining, 0, 86400)) return null; o.remaining = m.remaining; }
      if (m.phase === 'reveal') {
        var R = m.reveal; if (!R || typeof R !== 'object') return null;
        var why = {};
        if (R.why != null) { if (typeof R.why !== 'object') return null; Object.keys(R.why).forEach(function(k){ if (/^[A-H]$/.test(k)) why[k] = str(R.why[k], 3000); }); }
        o.reveal = { answer: letter(R.answer), explain: optStr(R.explain, 20000), why: why, objective: optStr(R.objective, 3000), image: imageOf(R.image) };
        o.final = answerOf(m.final);
      }
    }
    if (m.phase === 'end') {
      var r = m.result;
      if (!r || typeof r !== 'object' || !isInt(r.score, 0, 10000) || !isInt(r.total, 0, 10000) || !Array.isArray(r.items) || r.items.length > 10000) return null;
      o.result = { score: r.score, total: r.total, items: r.items.map(function(it){ if (!it || !isInt(it.n, 1, 10000)) throw 0; return { n: it.n, mine: it.mine == null ? null : letter(it.mine), correct: letter(it.correct) }; }) };
    }
    return o;
  } catch(e){ return null; }
}

function onState(m){
  var key = m.qi + ':' + m.round;
  if (key !== selKey) { selKey = key; sel = null; if (pending && (pending.qi !== m.qi || pending.round !== m.round)) pending = null; }
  if (m.mine) pending = null;
  if (m.phase !== 'vote') pending = null;
  deadline = (m.phase === 'vote' && typeof m.remaining === 'number') ? Date.now() + m.remaining*1000 : null;
  var changedScreen = !st || st.phase !== m.phase || st.qi !== m.qi || st.round !== m.round;
  st = m; render(changedScreen);
}
function sendAnswer(){
  if (!pending || !conn || !conn.open || !conn._ok) return;
  try { conn.send({ t:'answer', qi: pending.qi, round: pending.round, c: pending.c, sure: pending.sure }); } catch(e){}
}
function submit(sure){
  if (!st || st.phase !== 'vote' || st.mine || !sel) return;
  pending = { qi: st.qi, round: st.round, c: sel, sure: sure };
  sendAnswer(); render();
}

/* ---------- rendering (every value is escaped) ---------- */
function stemHtml(stem){
  var html = '', list = [];
  function flush(){ if (list.length) { html += '<ul>' + list.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('') + '</ul>'; list = []; } }
  String(stem).split('\n').forEach(function(ln){ if (ln.indexOf('• ') === 0) list.push(ln.slice(2)); else { flush(); if (ln.trim()) html += '<p>'+esc(ln)+'</p>'; } });
  flush(); return html;
}
function figHtml(im){
  if (!im || !im.id) return '';
  var e = imgs[im.id], ok = e && e.data && im.hash && e.hash === im.hash;
  var inner = ok ? '<img src="'+esc(e.data)+'" alt="'+esc(im.caption || 'Image')+'" data-zoom>' : '<div class="imgload">'+(e && e.data ? 'Picture could not be verified' : 'Loading image…')+'</div>';
  return '<figure class="qimg">' + inner + (im.caption ? '<figcaption>'+esc(im.caption)+'</figcaption>' : '') + '</figure>';
}
function setDock(html){ if (html) { dock.innerHTML = '<div class="in">'+html+'</div>'; dock.hidden = false; } else { dock.hidden = true; dock.innerHTML = ''; } }
function header(){
  document.getElementById('ht').textContent = st && st.q ? ('Question ' + (st.qi+1) + ' of ' + st.total) : (st && st.title ? st.title : 'Live quiz');
  document.getElementById('labBtn').hidden = !(st && st.q);
  if (labOpen && (!st || !st.q || st.qi !== labQi)) closeLab(false);       // the question changed or ended
}

"Other","Red cell volume, female","19–31 mL/kg",""],["Urine & BMI","Urine","Calcium","100–300 mg/24 h","ca"],["Urine & BMI","Urine","Osmolality","50–1200 mOsmol/kg H₂O","osm"],["Urine & BMI","Urine","Oxalate","8–40 µg/mL",""],["Urine & BMI","Urine","Proteins, total","<150 mg/24 h","protein proteinuria"],["Urine & BMI","Body mass index","BMI, adult","19–25 kg/m²","bmi body mass index"]];
var labOpen = false, labQi = -1, labTab = 'Serum';
var LAB_TABS = ['Serum', 'CSF', 'Blood', 'Urine & BMI'];
function labRows(){
  var el = document.getElementById('labList'), q = (document.getElementById('labQ').value || '').trim().toLowerCase(), html = '', last = '';
  var hits = LABS.filter(function(r){ return q ? (r[2] + ' ' + r[4] + ' ' + r[1]).toLowerCase().indexOf(q) >= 0 : r[0] === labTab; });
  hits.forEach(function(r){
    var gh = q ? '' : r[1];
    if (gh && gh !== last) { html += '<div class="labg">' + esc(gh) + '</div>'; last = gh; }
    html += '<div class="labr"><span>' + esc(r[2]) + (q ? '<span class="tab">' + esc(r[0] === 'Serum' && r[1].indexOf('blood gases') >= 0 ? 'Arterial blood gases' : r[0]) + '</span>' : '') + '</span><span class="v">' + esc(r[3]) + '</span></div>';
  });
  el.innerHTML = html || '<p class="muted">No test matches “' + esc(q) + '”.</p>';
  document.getElementById('labTabs').classList.toggle('dim', !!q);
  Array.prototype.forEach.call(document.querySelectorAll('#labTabs button'), function(b){ b.classList.toggle('sel', b.getAttribute('data-tab') === labTab); });
}
function openLab(){
  var sh = document.getElementById('lab');
  if (!sh.firstChild) {
    sh.innerHTML = '<div class="in"><input id="labQ" type="search" placeholder="Search, e.g. potassium, BUN, TSH" aria-label="Search lab tests" autocomplete="off">' +
      '<div class="labtabs" id="labTabs">' + LAB_TABS.map(function(t){ return '<button type="button" data-tab="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div>' +
      '<div id="labList"></div><p class="labsrc">Reference ranges: NBME Laboratory Reference Values (December 2024), the table shown on USMLE exams. Conventional units.</p></div>';
    document.getElementById('labQ').addEventListener('input', labRows);
    document.getElementById('labTabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; labTab = b.getAttribute('data-tab'); document.getElementById('labQ').value = ''; labRows(); sh.scrollTop = 0; });
  }
  sh.style.top = document.querySelector('header').offsetHeight + 'px';
  labRows(); sh.hidden = false; labOpen = true; labQi = st && st.q ? st.qi : -1;
  document.body.style.overflow = 'hidden';
  var b = document.getElementById('labBtn'); b.textContent = '✕ Labs'; b.classList.add('on'); b.setAttribute('aria-expanded', 'true');
  try { history.pushState({ lab: 1 }, ''); } catch(e){}
}
function closeLab(fromBack){
  if (!labOpen) return;
  labOpen = false; document.getElementById('lab').hidden = true; document.body.style.overflow = '';
  var b = document.getElementById('labBtn'); b.textContent = 'Labs'; b.classList.remove('on'); b.setAttribute('aria-expanded', 'false');
  if (!fromBack && history.state && history.state.lab) try { history.back(); } catch(e){}
}
document.getElementById('labBtn').addEventListener('click', function(){ if (labOpen) closeLab(false); else openLab(); });
window.addEventListener('popstate', function(){ if (labOpen) closeLab(true); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && labOpen) closeLab(false); });
function tick(){
  var tm = document.getElementById('tm');
  if (deadline && st && st.phase === 'vote') { var s = Math.max(0, Math.ceil((deadline - Date.now())/1000)); tm.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); tm.classList.toggle('low', s <= 10); }
  else tm.textContent = '';
}
setInterval(tick, 500);

function render(scrollTop){
  header(); tick();
  if (status === 'untrusted') {
    setDock(''); document.getElementById('ht').textContent = 'Live quiz';
    app.innerHTML = '<div class="center"><div class="big bad">⚠ This isn’t your teacher’s screen</div>'+
      '<p>The quiz this page reached could not prove it is the one on the projector, so nothing from it is shown.</p>'+
      '<p class="muted">Scan the QR code on the projector again, or open the link your teacher shared.</p></div>';
    return;
  }
  if (!st) {
    setDock('');
    var msg = { connecting:'Connecting to the quiz…', verifying:'Checking the teacher’s screen…', reconnecting:'Reconnecting…', waiting:'Waiting for the teacher’s screen…' }[status] || 'Connecting…';
    app.innerHTML = '<div class="center"><div class="spin"></div><div class="big">'+msg+'</div><p class="muted">Session code <b>'+esc(CODE)+'</b>. Keep this page open.</p></div>';
    return;
  }
  var offline = status !== 'connected' ? '<div class="banner info">'+(status === 'waiting' ? 'Waiting for the teacher’s screen…' : 'Connection lost — reconnecting…')+'</div>' : '';
  if (st.phase === 'lobby') {
    setDock('');
    app.innerHTML = offline + '<div class="center"><div class="big">You’re in ✓</div>'+
      '<p><b>'+esc(st.title)+'</b><br><span class="muted">session '+esc(CODE)+' · teacher’s screen verified</span></p>'+
      '<p class="muted">Check that this matches the screen. Wait for the teacher to start. Answers are anonymous.</p></div>';
  } else if (st.phase === 'end') {
    renderEnd(offline);
  } else {
    renderQuestion(offline);
  }
  if (scrollTop === true) window.scrollTo(0, 0);
}

function optsHtml(mode){
  var q = st.q, ans = st.reveal ? st.reveal.answer : null;
  var mine = st.mine ? st.mine.c : (pending ? pending.c : null);
  var fin = st.final ? st.final.c : null;
  return '<div class="opts">' + q.options.map(function(o, i){
    var l = L[i], cls = 'opt', dis = mode !== 'pick';
    if (mode === 'pick' && sel === l) cls += ' sel';
    if (mode === 'locked' && mine === l) cls += ' sel';
    if (mode === 'reveal') { if (l === ans) cls += ' correct'; else if (l === fin) cls += ' wrong'; else cls += ' fade'; }
    return '<button class="'+cls+'" data-l="'+l+'"'+(dis?' disabled':'')+' aria-pressed="'+(cls.indexOf(' sel')>=0)+'"><span class="l">'+l+'</span><span class="x">'+esc(o)+'</span></button>';
  }).join('') + '</div>';
}

function renderQuestion(offline){
  var q = st.q, html = offline;
  var r2 = st.round === 2;
  if (st.phase === 'vote') {
    var locked = !!(st.mine || pending);
    if (r2) html += '<div class="banner r2">Round 2 · Discuss with your neighbour, then answer again.' + (st.first ? ' Your first answer: <b>'+esc(st.first.c)+'</b>' : '') + '</div>';
    html += '<div class="stem">'+stemHtml(q.stem)+'</div>'+figHtml(q.image)+'<p class="lead">'+esc(q.lead)+'</p>' + optsHtml(locked ? 'locked' : 'pick');
    app.innerHTML = html;
    if (st.mine) setDock('<div class="msg">✓ Answer sent: '+esc(st.mine.c)+(st.confidence && st.mine.sure !== null ? (st.mine.sure ? ' (sure)' : ' (guessing)') : '')+' — wait for the others</div>');
    else if (pending) setDock('<div class="msg">Sending…</div>');
    else if (st.confidence) setDock('<button class="alt" data-sure="0"'+(sel?'':' disabled')+'>I’m guessing</button><button data-sure="1"'+(sel?'':' disabled')+'>I’m sure</button>');
    else setDock('<button data-sure="1"'+(sel?'':' disabled')+'>Submit answer</button>');
  } else if (st.phase === 'closed') {
    setDock('');
    html += '<div class="banner info">Voting closed — look at the screen.' + (st.mine ? ' Your answer: <b>'+esc(st.mine.c)+'</b>' : ' You didn’t answer this round.') + '</div>';
    html += '<details><summary>Show the question</summary><div class="stem">'+stemHtml(q.stem)+'</div>'+figHtml(q.image)+'<p class="lead">'+esc(q.lead)+'</p>'+optsHtml('locked')+'</details>';
    app.innerHTML = html;
  } else if (st.phase === 'reveal') {
    setDock('');
    var R = st.reveal, fin = st.final;
    if (!fin) html += '<div class="banner info">You didn’t answer. Correct answer: <b>'+esc(R.answer)+'</b></div>';
    else if (fin.c === R.answer) html += '<div class="banner good">Correct ✓ — '+esc(R.answer)+'</div>';
    else html += '<div class="banner bad">Not this time. You chose '+esc(fin.c)+', the correct answer is <b>'+esc(R.answer)+'</b></div>';
    html += optsHtml('reveal');
    var why = R.why || {}, wl = L.slice(0, q.options.length).filter(function(l){ return l !== R.answer && why[l]; });
    html += '<div class="card explain">' + (R.explain ? '<p style="margin-top:0">'+esc(R.explain)+'</p>' : '') + figHtml(R.image) +
      (wl.length ? '<h3>Why not the others</h3><ul class="why">' + wl.map(function(l){ return '<li'+(fin && fin.c === l ? ' class="mine"' : '')+'><b>'+l+'</b>'+esc(why[l])+'</li>'; }).join('') + '</ul>' : '') +
      (R.objective ? '<p class="obj"><b>Take-home:</b> '+esc(R.objective)+'</p>' : '') + '</div>';
    html += '<details><summary>Show the question</summary><div class="stem">'+stemHtml(q.stem)+'</div>'+figHtml(q.image)+'<p class="lead">'+esc(q.lead)+'</p></details>';
    app.innerHTML = html;
  }
}

function renderEnd(offline){
  setDock('');
  var r = st.result || { score:0, total:0, items:[] };
  var pc = r.total ? Math.round(r.score*100/r.total) : 0;
  app.innerHTML = offline + '<div class="card center" style="padding:28px 16px"><div class="muted">Your score</div><div class="score">'+esc(r.score)+' / '+esc(r.total)+'</div><div class="big">'+esc(pc)+'%</div><p class="muted">Only you can see this.</p></div>' +
    '<div class="card"><div class="res">' + r.items.map(function(it){
      var ok = it.mine === it.correct;
      return '<span>Q'+esc(it.n)+'</span><span class="muted">'+(it.mine ? 'You: '+esc(it.mine)+(ok ? '' : ' · correct: '+esc(it.correct)) : 'No answer · correct: '+esc(it.correct))+'</span><span class="'+(ok?'ok':'no')+'">'+(ok?'✓':'✗')+'</span>';
    }).join('') + '</div></div>';
}

app.addEventListener('click', function(e){
  var z = e.target.closest('img[data-zoom]');
  if (z) {
    var o = document.createElement('div'); o.className = 'zoom';
    o.innerHTML = '<img alt=""><button class="x" aria-label="Close">×</button>'; o.querySelector('img').src = z.src;
    o.addEventListener('click', function(ev){ if (ev.target.closest('.x') || ev.target === o) o.remove(); });
    document.body.appendChild(o); return;
  }
  var b = e.target.closest('.opt'); if (!b || b.disabled || !st || st.phase !== 'vote' || st.mine || pending) return;
  sel = b.getAttribute('data-l'); render();
});
dock.addEventListener('click', function(e){ var b = e.target.closest('button[data-sure]'); if (!b || b.disabled) return; submit(b.getAttribute('data-sure') === '1'); });

/* Joining by typing: the session code AND the check code shown under the QR code on the teacher's screen. */
function renderJoin(){
  document.getElementById('ht').textContent = 'Join the quiz';
  app.innerHTML = '<form class="card join center" id="jf">'+
    '<p>Enter the two codes shown on the teacher’s screen</p>'+
    '<label for="jc">Session code</label><input id="jc" maxlength="8" autocomplete="off" autocapitalize="characters" value="'+esc(CODE)+'">'+
    '<label for="jk">Check code</label><input id="jk" maxlength="9" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX">'+
    '<p class="bad" id="jerr"></p><button type="submit">Join</button>'+
    '<p class="muted small">Scanning the QR code or opening your teacher’s link needs no codes.</p></form>';
  document.getElementById('jf').addEventListener('submit', function(e){
    e.preventDefault();
    var v = document.getElementById('jc').value.toUpperCase().replace(/[^A-Z0-9]/g, ''), k = normCheck(document.getElementById('jk').value);
    if (!v) { document.getElementById('jerr').textContent = 'Enter the session code.'; return; }
    if (k.length !== 8) { document.getElementById('jerr').textContent = 'The check code has 8 characters.'; return; }
    var qs = new URLSearchParams(location.search); qs.set('s', v);
    var target = location.pathname + '?' + qs.toString();
    if (target === location.pathname + location.search) { location.hash = 'c=' + k; location.reload(); }
    else location.href = target + '#c=' + k;
  });
}

render(); startPeer();
})();
