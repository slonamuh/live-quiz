<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Live Quiz — Self-study</title>
<style>
/* Shared look, built into every page by tools/build_pages.py: one palette, one font, one button.
   The phone pages (join, study) also take theme-dark.css. Page-specific colours stay in each page. */
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#15171c; --muted:#5b616d; --line:#d9d6ce;
  --soft:#eceae4;            /* letter circles, small tags */
  --track:#efede8;           /* empty part of a bar */
  --accent:#2350b8; --accent-soft:#dbe4f8;
  --accent-ink:#ffffff;      /* text on a solid accent, green or red fill */
  --good:#16804a; --good-soft:#d7efe0; --bad:#b93a27; --bad-soft:#f6ddd8;
  --warn:#a86a10; --warn-soft:#fbe9c6; --warn-ink:#7a4a00;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:.5rem 1rem;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{filter:none}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.btn.small{padding:.28rem .65rem;font-size:.85rem}
a.btn{display:inline-block;text-decoration:none}
/* the teacher pages' links in the top bar: Player · Editor · Self-study */
.pagenav{display:inline-flex;gap:.15rem;align-items:center;margin-left:.3rem}
.pagenav a{padding:.25rem .7rem;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem}
.pagenav a[href]:hover{color:var(--ink);background:var(--soft)}
.pagenav a[aria-current]{color:var(--accent);background:var(--accent-soft)}
/* keyboard focus: one clear ring on every page (a mouse click or a tap does not show it) */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* a file input kept reachable with Tab inside its button-like label */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
label:has(> .vh:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

/* Dark palette for the phone pages (join, study), when the phone is set to dark mode. Same names as theme.css. */
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161a; --panel:#1d2026; --ink:#eceae5; --muted:#a3a8b3; --line:#343842; --soft:#2c3038; --track:#2a2e36;
    --accent:#6f95f0; --accent-soft:#25335a; --accent-ink:#10131a;
    --good:#4cc283; --good-soft:#173826; --bad:#f07a66; --bad-soft:#40211c;
    --warn:#e0a643; --warn-soft:#3d3015; --warn-ink:#f2c46d; }
}

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.wrap{max-width:44rem;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
header .t{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.homebtn{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;cursor:pointer}
h1{font-size:1.5rem;margin:18px 0 6px}
h2{font-size:1.1rem;margin:22px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.center{text-align:center;padding:28px 8px}
.score{font-size:3.2rem;font-weight:800;line-height:1;margin:.15em 0}
.big{font-size:1.5rem;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.banner{border-radius:12px;padding:12px 14px;margin:14px 0;font-weight:600}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft)}
.stem{margin-top:14px}
.stem p{margin:0 0 .6em}
.stem ul{margin:.2em 0 .7em 1.1em;padding:0}
.lead{font-weight:700;margin:.8em 0 0}
.opts{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt .l{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line)}
.opt .x{padding-top:4px;min-width:0}
.stem,.lead,.opt .x,figcaption,.explain,.banner,.setrow{overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .l{background:var(--good);color:var(--accent-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:var(--accent-ink)}
.opt.fade{opacity:.6}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.dock .in{max-width:44rem;margin:0 auto;display:flex;gap:10px}
.dock button{flex:1;min-height:54px;border-radius:12px;border:0;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.dock button.alt{background:var(--panel);color:var(--ink);border:2px solid var(--accent)}
.dock button:disabled{opacity:.4;cursor:default}
.explain h3{margin:16px 0 6px;font-size:1rem}
.why{list-style:none;margin:0;padding:0}
.why li{padding:8px 10px;border-radius:10px;margin:4px 0}
.why li.mine{background:var(--bad-soft)}
.why b{display:inline-block;width:1.4em}
.obj{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
figure.qimg{margin:10px 0 12px;text-align:center}
figure.qimg img{max-width:100%;max-height:55vh;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
figure.qimg figcaption{color:var(--muted);font-size:.85rem;margin-top:4px}
.zoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.zoom .x{position:absolute;top:10px;right:12px;background:#fff;color:#000;border:0;border-radius:50%;width:40px;height:40px;font-size:22px;font-weight:700;cursor:pointer}
.sets{display:flex;flex-direction:column;gap:10px}
.setrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.setrow .tx{flex:1;min-width:0}
.setrow .st{font-weight:700}
.setrow .sd{font-size:.88rem;margin:.15rem 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.setrow .sm{font-size:.8rem;color:var(--muted)}
.setrow .go{color:var(--accent);font-weight:800}
.forget{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;width:36px;height:36px;cursor:pointer;color:var(--muted)}
.mine{display:flex;gap:8px;align-items:center}
.mine .setrow{flex:1}
.filebtn{display:block;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:14px;margin-top:10px;font-weight:700;color:var(--accent);cursor:pointer;background:transparent}
body.over .filebtn{border-color:var(--accent);background:var(--accent-soft)}
fieldset.mode{border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;margin:14px 0;background:var(--panel)}
fieldset.mode legend{font-weight:700;padding:0 6px}
fieldset.mode label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
fieldset.mode input{margin-top:4px;width:18px;height:18px;flex:none}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;cursor:pointer;text-decoration:underline}
.res{display:flex;flex-direction:column;gap:8px}
.resrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.resrow .n{flex:none;width:1.8rem;font-weight:800;color:var(--muted)}
.resrow .mk{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.resrow .mk.ok{background:var(--good-soft);color:var(--good)}
.resrow .mk.no{background:var(--bad-soft);color:var(--bad)}
.resrow .mk.none{background:var(--line)}
.resrow .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.resrow .rt small{color:var(--muted);font-size:.8rem}
.err{white-space:pre-line}
/* lab values sheet (NBME reference values), opened from the header during a question */
.labbtn{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;cursor:pointer}
.labbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.labsheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.labsheet .in{max-width:40rem;margin:0 auto;padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.labsheet input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px}
.labtabs{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.labtabs button{flex:1;min-width:4.5rem;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 6px;font-weight:600;font-size:.9rem;cursor:pointer}
.labtabs button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.labtabs.dim button{opacity:.45}
.labg{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.labr{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.labr .v{text-align:right;font-weight:700;white-space:nowrap}
.labr .tab{font-size:.75rem;color:var(--muted);display:block}
.labsrc{font-size:.75rem;color:var(--muted);margin-top:14px}

</style>
</head>
<body>
<header><button class="homebtn" id="homeBtn" type="button" hidden>☰ Sets</button><span class="t" id="ht">Self-study</span><button class="labbtn" id="labBtn" type="button" hidden aria-expanded="false">Labs</button></header>
<div class="labsheet" id="lab" hidden role="dialog" aria-label="Laboratory reference values"></div>
<main class="wrap" id="app"></main>
<div class="dock" id="dock" hidden></div>
<script>
(function(){
'use strict';
/* Self-study: one student, one device, no teacher and no connection. Sets come from the course folder
   (sets/ in this site, listed by sets/index.json and, on GitHub Pages, by GitHub's folder listing so that
   a file uploaded there appears without a rebuild) or from a quiz file the student opens.
   Practice: the answer and explanation after each case. Exam: nothing until the end, then the score and a review.
   Sets are kept in IndexedDB ("livequiz-study"), progress in localStorage; nothing is sent anywhere. */
var LET = 'ABCDEFGH'.split('');
function letters(n){ return LET.slice(0, n); }
function nOf(n, word){ n = +n || 0; return n + ' ' + word + (n === 1 ? '' : 's'); }   // 1 case, 2 cases
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function str(x){ return typeof x === 'string' ? x.trim() : ''; }
var app = document.getElementById('app'), dock = document.getElementById('dock');
/* Shared by the player and the self-study page: checks a quiz pack (format version 1).
   Needs letters(n) from the page. */
var IMG_RE = /^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,[A-Za-z0-9+\/=]+$/;
/* Optional teacher-only fields: the quiz's description, and per case a First Aid topic path
   (chapter › subtopic › entry, up to 3 levels) and the concept it tests. They are shown only on the
   quiz-choosing page (and in the results); never sent to phones. A topic may be a list or "A › B › C". */
function topicOf(q){
  var t = q && q.topic;
  if (typeof t === 'string') t = t.split(/\s*[›>]\s*/);
  if (!Array.isArray(t)) return [];
  return t.map(function(x){ return typeof x === 'string' ? x.trim() : ''; }).filter(Boolean).slice(0, 3);
}
function conceptOf(q){ return q && typeof q.concept === 'string' ? q.concept.trim() : ''; }
function checkPack(p){
  var errs = [], warns = [];
  if (!p || typeof p !== 'object' || Array.isArray(p)) return { errs: ['This file is not a quiz file.'], warns: [] };
  if (!Array.isArray(p.questions) || !p.questions.length) return { errs: ['The file has no cases.'], warns: [] };
  if (p.description != null && typeof p.description !== 'string') errs.push('The quiz description must be text.');
  var images = (p.images && typeof p.images === 'object') ? p.images : {};
  Object.keys(images).forEach(function(k){ if (typeof images[k] !== 'string' || !IMG_RE.test(images[k])) errs.push('Image “' + k + '” is not a valid embedded picture.'); });
  p.questions.forEach(function(q, i){
    var n = 'Case ' + (i+1) + ': ';
    if (!q || typeof q !== 'object') { errs.push(n + 'is empty.'); return; }
    if (typeof q.stem !== 'string' || !q.stem.trim()) errs.push(n + 'the case text is missing.');
    if (typeof q.lead !== 'string' || !q.lead.trim()) errs.push(n + 'the question line is missing.');
    if (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 8 || q.options.some(function(o){ return typeof o !== 'string' || !o.trim(); })) { errs.push(n + 'needs 2 to 8 answer options, none empty.'); return; }
    var ls = letters(q.options.length);
    if (ls.indexOf(q.answer) < 0) errs.push(n + 'the correct answer must be one of ' + ls.join(', ') + '.');
    ['image', 'explainImage'].forEach(function(k){ if (q[k] && !images[q[k]]) errs.push(n + 'picture “' + q[k] + '” is missing from the pack.'); });
    if (q.topic != null && typeof q.topic !== 'string' && !(Array.isArray(q.topic) && q.topic.length <= 3 && q.topic.every(function(t){ return typeof t === 'string'; }))) errs.push(n + 'the topic must be up to 3 names: chapter, subtopic, entry.');
    if (q.concept != null && typeof q.concept !== 'string') errs.push(n + 'the concept must be text.');
    if (!q.explain) warns.push('Case ' + (i+1) + ' has no explanation.');
  });
  return { errs: errs, warns: warns };
}

   with <button id="labBtn">, and <div id="lab" class="labsheet" hidden>. */

var store = {
  get: function(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
var PROG = 'livequiz-study-progress-v1', MODE = 'livequiz-study-mode', LISTING = 'livequiz-study-listing-v1';
function progAll(){ return store.get(PROG) || {}; }
function progOf(rec){ var p = rec && progAll()[rec.key]; return p && p.ver === rec.ver ? p : null; }
function progSave(rec, p){ var a = progAll(); if (p) a[rec.key] = p; else delete a[rec.key]; store.set(PROG, a); }
var idb = (function(){
  var dbp = null;
  function open(){
    if (!dbp) dbp = new Promise(function(res, rej){
      var r = indexedDB.open('livequiz-study', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('sets', { keyPath: 'key' }); };
      r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn){ return open().then(function(db){ return new Promise(function(res, rej){
    var t = db.transaction('sets', mode), q = fn(t.objectStore('sets'));
    t.oncomplete = function(){ res(q && q.result); }; t.onerror = t.onabort = function(){ rej(t.error); };
  }); }); }
  return {
    get: function(k){ return tx('readonly', function(s){ return s.get(k); }).catch(function(){ return null; }); },
    all: function(){ return tx('readonly', function(s){ return s.getAll(); }).catch(function(){ return []; }); },
    put: function(v){ return tx('readwrite', function(s){ return s.put(v); }); },
    del: function(k){ return tx('readwrite', function(s){ return s.delete(k); }).catch(function(){}); }
  };
})();
function hash(s){ var h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (var i=0, ch; i<s.length; i++){ ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909); h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(36); }
function verOf(p){ return hash(JSON.stringify(p.questions) + JSON.stringify(Object.keys(p.images || {}))); }
function pretty(f){ var s = String(f).replace(/\.quiz\.json$/i, '').replace(/\.json$/i, '').replace(/[-_]+/g, ' ').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : 'Untitled set'; }
function modeName(m){ return m === 'exam' ? 'Exam' : 'Practice'; }

/* ---------- sets ---------- */
var SETS = new URL('../sets/', location.href);
var FILE_RE = /^[A-Za-z0-9_.-]+\.quiz\.json$/;
function ghRepo(){                                  // "owner/repo" on GitHub Pages (or ?gh=owner/repo)
  var o = new URLSearchParams(location.search).get('gh');
  if (o && /^[\w.-]+\/[\w.-]+$/.test(o)) return o;
  var m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i), seg = location.pathname.split('/').filter(Boolean)[0];
  return m && seg ? m[1] + '/' + seg : '';
}
function ghListing(){                               // file names in sets/ (cached 20 minutes; GitHub allows 60 requests an hour per address)
  var repo = ghRepo(); if (!repo) return Promise.resolve(null);
  var c = store.get(LISTING), fresh = c && c.repo === repo && Date.now() - c.at < 20*60*1000;
  if (fresh) return Promise.resolve(c.files);
  return fetch('https://api.github.com/repos/' + repo + '/contents/sets', { headers: { Accept: 'application/vnd.github+json' } })
    .then(function(r){ if (r.status === 404) return []; if (!r.ok) throw new Error('listing'); return r.json(); })
    .then(function(a){
      var files = (Array.isArray(a) ? a : []).filter(function(f){ return f && f.type === 'file' && FILE_RE.test(f.name); }).map(function(f){ return f.name; });
      store.set(LISTING, { repo: repo, at: Date.now(), files: files }); return files;
    })
    .catch(function(){ return c && c.repo === repo ? c.files : null; });
}
function courseSets(){
  var idx = fetch(new URL('index.json', SETS), { cache: 'no-cache' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ return j && Array.isArray(j.sets) ? j.sets : null; }).catch(function(){ return null; });
  return Promise.all([idx, ghListing()]).then(function(v){
    var index = v[0], files = v[1], by = {};
    if (index === null && files === null) return null;
    (index || []).forEach(function(s){ if (s && FILE_RE.test(s.file)) by[s.file] = s; });
    var names = files || Object.keys(by);
    return names.filter(function(f){ return FILE_RE.test(f); }).map(function(f){
      var s = by[f] || {};
      return { file: f, title: str(s.title), description: str(s.description), n: s.n };
    }).sort(function(a, b){ return (a.title || pretty(a.file)).localeCompare(b.title || pretty(b.file)); });
  });
}
function keep(key, source, file, p){                // validate, then remember the set on this device
  var c = checkPack(p);
  if (c.errs.length) { var e = new Error('This quiz file has problems:\n• ' + c.errs.slice(0, 5).join('\n• ')); e.bad = true; throw e; }
  var rec = { key: key || ('file:' + verOf(p)), source: source, file: file || '', title: str(p.title) || pretty(file || 'Untitled set'), description: str(p.description), n: p.questions.length, ver: verOf(p), pack: p, usedAt: Date.now() };
  return idb.put(rec).then(function(){ return rec; }, function(){ return rec; });
}
function openCourse(file){
  var key = 'course:' + file;
  return fetch(new URL(encodeURIComponent(file), SETS), { cache: 'no-cache' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(p){ return keep(key, 'course', file, p); })
    .catch(function(e){
      if (e && e.bad) throw e;
      return idb.get(key).then(function(rec){ if (rec) return rec; throw new Error('This set could not be loaded. Check the internet connection and try again.'); });
    });
}
function openFile(f){
  if (!f) return;
  f.text().then(function(t){
    var p; try { p = JSON.parse(t); } catch(e){ throw new Error('“' + f.name + '” is not a quiz file (.quiz.json).'); }
    return keep('', 'file', f.name, p);
  }).then(function(rec){ showSet(rec); }, function(e){ homeMsg(e.message); });
}

  String(stem).split('\n').forEach(function(ln){ if (ln.indexOf('• ') === 0) list.push(ln.slice(2)); else { flush(); if (ln.trim()) html += '<p>'+esc(ln)+'</p>'; } });

    '<p class="muted">' + nOf(rec.n, 'case') + ' · ' + (rec.source === 'course' ? 'course set' : 'from a file') + '</p>' +
    (p && !p.done ? '<div class="card" id="inprog"><b>In progress:</b> case ' + (p.i + 1) + ' of ' + rec.n + ' · ' + modeName(p.mode) + '</div>' : '') +
    (p && p.done ? '<div class="card" id="last">Last score <b>' + p.score + ' / ' + rec.n + '</b> (' + Math.round(p.score * 100 / rec.n) + '%) · ' + modeName(p.mode) + ' · <button class="link" data-do="results">See results</button></div>' : '') +
    '<fieldset class="mode"><legend>Mode</legend>' +
      '<label><input type="radio" name="mode" value="practice"' + (mode === 'practice' ? ' checked' : '') + '><span><b>Practice</b><br><span class="muted small">The answer and explanation after each case</span></span></label>' +
      '<label><input type="radio" name="mode" value="exam" id="modeExam"' + (mode === 'exam' ? ' checked' : '') + '><span><b>Exam</b><br><span class="muted small">No answers until the end; then your score and a review of every case</span></span></label></fieldset>';
  setDock(p && !p.done ? '<button class="alt" data-do="restart" id="restartBtn">Start over</button><button data-do="continue" id="goBtn">Continue</button>'
    : '<button data-do="start" id="goBtn">Start</button>');
  window.scrollTo(0, 0);
}
function chosenMode(){ var r = document.querySelector('input[name="mode"]:checked'); return r && r.value === 'exam' ? 'exam' : 'practice'; }
function startRun(){
  var mode = chosenMode(); store.set(MODE, mode);
  var p = { ver: cur.rec.ver, mode: mode, i: 0, answers: {}, done: false, startedAt: Date.now() };
  progSave(cur.rec, p); cur.rec.usedAt = Date.now(); idb.put(cur.rec).catch(function(){});
  showCase();
}
function showCase(){
  var rec = cur.rec, p = progOf(rec); if (!p) return showSet(rec);
  var qs = rec.pack.questions, q = qs[p.i], mine = p.answers[p.i];
  cur.view = 'case'; cur.qi = p.i; sel = null;
  setHead(modeName(p.mode) + ' · Case ' + (p.i + 1) + ' of ' + qs.length, true);
  var h = caseHtml(q);
  if (p.mode === 'practice' && mine) {
    h += answerHtml(q, mine);
    setDock('<button data-do="next" id="nextBtn">' + (p.i < qs.length - 1 ? 'Next case' : 'See results') + '</button>');
  } else {
    var ls = letters(q.options.length);
    h += '<div class="opts" id="opts">' + q.options.map(function(o, i){ return '<button class="opt" data-pick="' + ls[i] + '" data-l="' + ls[i] + '"><span class="l">' + ls[i] + '</span><span class="x">' + esc(o) + '</span></button>'; }).join('') + '</div>';
    setDock('<button data-do="submit" id="submitBtn" disabled>' + (p.mode === 'exam' ? (p.i < qs.length - 1 ? 'Submit & next case' : 'Submit & finish') : 'Submit answer') + '</button>');
  }
  app.innerHTML = h;
}
function pick(l){
  sel = l;
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function(b){ b.classList.toggle('sel', b.getAttribute('data-pick') === l); });
  var s = document.getElementById('submitBtn'); if (s) s.disabled = false;
}
function submit(){
  var rec = cur.rec, p = progOf(rec); if (!p || !sel || p.answers[p.i]) return;
  p.answers[p.i] = sel; progSave(rec, p);
  if (p.mode === 'exam') return nextCase();
  showCase();
  var v = document.getElementById('verdict'); if (v && v.scrollIntoView) v.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function nextCase(){
  var rec = cur.rec, p = progOf(rec), n = rec.pack.questions.length; if (!p) return;
  if (p.i < n - 1) { p.i++; progSave(rec, p); showCase(); window.scrollTo(0, 0); return; }
  var s = 0; rec.pack.questions.forEach(function(q, i){ if (p.answers[i] === q.answer) s++; });
  p.done = true; p.score = s; p.finishedAt = Date.now(); progSave(rec, p);
  showResults();
}
function showResults(){
  var rec = cur.rec, p = progOf(rec); if (!p || !p.done) return showSet(rec);
  var qs = rec.pack.questions, n = qs.length, pc = Math.round(p.score * 100 / n);
  cur.view = 'results'; cur.qi = -1;
  setHead('Results · ' + rec.title, false);
  app.innerHTML = '<div class="card center"><div class="muted">Your score · ' + modeName(p.mode) + '</div><div class="score" id="score">' + p.score + ' / ' + n + '</div><div class="big">' + pc + '%</div></div>' +
    '<p class="muted small">Tap a case to see its answer and explanation.</p><div class="res">' + qs.map(function(q, i){
      var mine = p.answers[i], ok = mine === q.answer, t = topicOf(q), c = conceptOf(q);
      return '<button class="resrow" data-rev="' + i + '"><span class="n">' + (i + 1) + '</span><span class="mk ' + (ok ? 'ok' : mine ? 'no' : 'none') + '">' + (ok ? '✓' : mine ? '✗' : '–') + '</span>' +
        '<span class="rt">' + (c ? '<b>' + esc(c) + '</b>' : '<b>Case ' + (i + 1) + '</b>') + (t.length ? '<small>' + t.map(esc).join(' › ') + '</small>' : '') +
        '<small>Your answer ' + esc(mine || '—') + ' · correct ' + esc(q.answer) + '</small></span></button>';
    }).join('') + '</div>';
  setDock((p.mode === 'exam' ? '<button data-do="review" id="reviewBtn">Review answers</button>' : '') + '<button class="alt" data-do="again" id="againBtn">Try again</button>');
  window.scrollTo(0, 0);
}
function showReview(i){
  var rec = cur.rec, p = progOf(rec), qs = rec.pack.questions; if (!p) return showSet(rec);
  i = Math.max(0, Math.min(qs.length - 1, i));
  cur.view = 'review'; cur.qi = i;
  setHead('Review · Case ' + (i + 1) + ' of ' + qs.length, true);
  app.innerHTML = caseHtml(qs[i]) + answerHtml(qs[i], p.answers[i]);
  setDock('<button class="alt" data-do="prev"' + (i === 0 ? ' disabled' : '') + '>‹ Previous</button><button class="alt" data-do="results">Results</button>' +
    (i < qs.length - 1 ? '<button data-do="nextrev" id="nextRevBtn">Next ›</button>' : ''));
  window.scrollTo(0, 0);
}

/* ---------- input ---------- */
function act(a){
  if (!cur) return;
  if (a === 'start') startRun();
  else if (a === 'continue') showCase();
  else if (a === 'restart') { if (armed === 'restart') { armed = ''; startRun(); } else { armed = 'restart'; var b = document.getElementById('restartBtn'); if (b) b.textContent = 'Tap again to start over'; } }
  else if (a === 'submit') submit();
  else if (a === 'next') nextCase();
  else if (a === 'results') showResults();
  else if (a === 'review') showReview(0);
  else if (a === 'prev') showReview(cur.qi - 1);
  else if (a === 'nextrev') showReview(cur.qi + 1);
  else if (a === 'again') showSet(cur.rec);
}
document.addEventListener('click', function(e){
  var t = e.target;
  var z = t.closest('img[data-zoom]');
  if (z) { var o = document.createElement('div'); o.className = 'zoom'; o.innerHTML = '<img alt="" src="' + esc(z.getAttribute('src')) + '"><button class="x" aria-label="Close">✕</button>'; o.addEventListener('click', function(){ o.remove(); }); document.body.appendChild(o); return; }
  var b = t.closest('[data-pick],[data-do],[data-course],[data-set],[data-forget],[data-rev]'); if (!b) return;
  if (b.hasAttribute('data-pick')) pick(b.getAttribute('data-pick'));
  else if (b.hasAttribute('data-do')) act(b.getAttribute('data-do'));
  else if (b.hasAttribute('data-rev')) showReview(+b.getAttribute('data-rev'));
  else if (b.hasAttribute('data-course')) { b.disabled = true; openCourse(b.getAttribute('data-course')).then(showSet, function(err){ homeMsg(err.message); }); }
  else if (b.hasAttribute('data-set')) idb.get(b.getAttribute('data-set')).then(function(r){ if (r) showSet(r); });
  else if (b.hasAttribute('data-forget')) { var k = b.getAttribute('data-forget'); idb.del(k).then(function(){ var a = progAll(); delete a[k]; store.set(PROG, a); home(); }); }
});
document.addEventListener('change', function(e){ if (e.target.id === 'file') { openFile(e.target.files[0]); e.target.value = ''; } });
document.getElementById('homeBtn').addEventListener('click', function(){ if (labOpen) closeLab(true); home(); });
window.addEventListener('popstate', function(){
  if (labPopHandled) { labPopHandled = false; return; }             // Back only closed the lab values
  if (!(history.state && history.state.study) && cur) home();
});
document.addEventListener('keydown', function(e){                 // laptop: letters choose, Enter goes on
  if (labOpen || !cur || e.target.matches('input,textarea') || document.querySelector('.zoom')) return;
  var k = e.key;
  if (/^[a-hA-H]$/.test(k) && cur.view === 'case') { var b = document.querySelector('#opts [data-pick="' + k.toUpperCase() + '"]'); if (b) { e.preventDefault(); pick(k.toUpperCase()); } }
  else if (k === 'Enter') { var d = dock.querySelector('button:not(.alt):not(:disabled)'); if (d) { e.preventDefault(); d.click(); } }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { var z = document.querySelector('.zoom'); if (z) z.remove(); } });
['dragover', 'dragenter'].forEach(function(ev){ document.addEventListener(ev, function(e){ if (!cur && e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); document.body.classList.add('over'); } }); });
document.addEventListener('dragleave', function(e){ if (!e.relatedTarget) document.body.classList.remove('over'); });
document.addEventListener('drop', function(e){ document.body.classList.remove('over'); if (!cur && e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); openFile(e.dataTransfer.files[0]); } });

home();
})();
</script>
</body>
</html>
